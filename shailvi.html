  <h1>Java Addition of Two Numbers</h1>
  <p>Below is a Java program that adds two numbers and prints the result:</p>
  <pre><code>public class AddTwoNumbers {
    public static void main(String[] args) {
        int a = 5;
        int b = 7;
        int sum = a + b;
        System.out.println("Sum: " + sum);
    }
}</code></pre>
