<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT Clone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <button class="new-chat-btn" id="new-chat-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M8 1V15M1 8H15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          New Chat
        </button>
      </div>

      <div class="chat-history" id="chat-history">
        <div class="chat-item active">
          <span>Today</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="chat-item">
          <span>Yesterday</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="chat-item">
          <span>Last 7 days</span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </div>
      </div>

      <div class="sidebar-footer">
        <button class="settings-btn">
          <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
            <circle cx="9" cy="9" r="1.5" fill="currentColor"/>
            <path d="M9 3C6.5 3 4.5 4.5 4.5 6.5M9 3C11.5 3 13.5 4.5 13.5 6.5M9 3V1" stroke="currentColor" stroke-width="1.5"/>
            <path d="M4.5 9C3 9 1.5 10 1.5 11.5M13.5 9C15 9 16.5 10 16.5 11.5M9 15V17" stroke="currentColor" stroke-width="1.5"/>
          </svg>
          Settings
        </button>
      </div>
    </aside>

    <!-- Main Chat Area -->
    <main class="chat-container">
      <!-- Header -->
      <header class="chat-header">
        <div class="header-title">
          <h1>Chat Assistant</h1>
          <p>Ask me anything</p>
        </div>
        <button class="menu-btn">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="2" fill="currentColor"/>
            <circle cx="19" cy="12" r="2" fill="currentColor"/>
            <circle cx="5" cy="12" r="2" fill="currentColor"/>
          </svg>
        </button>
      </header>

      <!-- Messages Area -->
      <div class="messages-area" id="messages-area">
        <div class="messages-container">
          <div class="welcome-section">
            <h2>Welcome to Chat Assistant</h2>
            <p>Start a conversation by typing below or uploading files</p>
            
            <div class="suggested-prompts">
              <div class="prompt-card">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path d="M10 2V18M2 10H18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Help me write</span>
              </div>
              <div class="prompt-card">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path d="M10 2C5.58 2 2 5.58 2 10S5.58 18 10 18S18 14.42 18 10" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span>Analyze image</span>
              </div>
              <div class="prompt-card">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path d="M4 6H16M4 10H16M4 14H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                </svg>
                <span>Code help</span>
              </div>
              <div class="prompt-card">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path d="M10 2C5.58 2 2 5.58 2 10S5.58 18 10 18S18 14.42 18 10S14.42 2 10 2Z" stroke="currentColor" stroke-width="2"/>
                </svg>
                <span>Creative ideas</span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Input Area -->
      <div class="input-section">
        <div class="search-bar">
          <textarea id="message-input" placeholder="Message Chat Assistant..." rows="1"></textarea>
          
          <div class="input-actions">
            <button class="attach-btn" id="attach-btn" title="Upload media">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M14 4H6C4.9 4 4 4.9 4 6V14C4 15.1 4.9 16 6 16H14C15.1 16 16 15.1 16 14V6C16 4.9 15.1 4 14 4Z" stroke="currentColor" stroke-width="1.5"/>
                <circle cx="10" cy="10" r="2" fill="currentColor"/>
              </svg>
            </button>
            <input type="file" id="file-input" accept="image/*,video/*,audio/*,.pdf,.txt,.doc,.docx" hidden>
            
            <button class="send-btn" id="send-btn" title="Send message">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M1 8L14 2L9 14L7 9L1 8Z" fill="currentColor"/>
              </svg>
            </button>
          </div>
        </div>
        
        <div class="file-preview" id="file-preview"></div>
        <p class="input-hint">Chat Assistant can make mistakes. Consider checking important information.</p>
      </div>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
